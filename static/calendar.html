<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Owner Calendar — AI Booking Demo</title>
<style>
body{margin:0;background:#f4f4f5;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111}.page{max-width:1000px;margin:0 auto;padding:30px 16px}.card{background:#fff;border-radius:18px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.1)}h1{margin:0 0 6px;font-size:26px}p{color:#777;font-size:13px}.row{display:flex;gap:10px;margin:18px 0}.row input{flex:1;border:1px solid #ddd;border-radius:10px;padding:11px;font:inherit}.row button{border:0;border-radius:10px;background:#111;color:#fff;padding:0 18px;font-weight:700}.booking{display:grid;grid-template-columns:160px 1fr 150px;gap:14px;padding:15px 0;border-top:1px solid #eee;font-size:13px}.muted{color:#888;font-size:11px}.error{color:#b42318;font-size:12px}@media(max-width:650px){.booking{grid-template-columns:1fr}.row{flex-direction:column}.row button{height:42px}}
</style>
</head>
<body>
<div class="page"><div class="card">
<h1>Owner calendar</h1><p>Protected demo view of appointments. The production version should use real staff authentication. If Google Calendar is connected, appointments are also written to the business calendar.</p>
<div class="row"><input id="token" type="password" placeholder="Admin token"><button id="load">Load appointments</button></div>
<div id="status" class="muted">Enter the configured ADMIN_TOKEN.</div>
<div id="bookings"></div>
</div></div>
<script>
const token=document.getElementById('token'),load=document.getElementById('load'),status=document.getElementById('status'),bookings=document.getElementById('bookings');
load.onclick=async()=>{status.textContent='Loading…';bookings.innerHTML='';try{const r=await fetch('/api/admin/bookings',{headers:{'X-Admin-Token':token.value}});const d=await r.json();if(!r.ok)throw new Error(d.detail||'Unable to load calendar.');if(!d.bookings.length){status.textContent='No confirmed appointments.';return;}status.textContent=`${d.bookings.length} confirmed appointment(s)`;d.bookings.forEach(b=>{const el=document.createElement('div');el.className='booking';const when=new Date(b.start_at).toLocaleString([], {dateStyle:'medium',timeStyle:'short'});el.innerHTML=`<div><strong>${when}</strong><div class="muted">${b.service}</div></div><div><strong>${escapeHtml(b.name)}</strong><div class="muted">${escapeHtml(b.email)}${b.phone?' · '+escapeHtml(b.phone):''}</div></div><div class="muted">${b.google_event_id?'Google synced':'Demo calendar'}</div>`;bookings.appendChild(el);});}catch(e){status.className='error';status.textContent=e.message;}};
function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
</script>
</body>
</html>
